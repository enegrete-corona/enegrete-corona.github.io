<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="styles/form.css">
    
</head>
<body>
    <form action="register_account.html" method="post" id="registration_form"></form>

    <fieldset>
        <legend>Registration Information</legend>
        <label for="email">E-Mail:</label>
        <input type="email" name="email" id="email"
            autofocus required autocomplete="on"><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required
            placeholder="At least 6 letters or numbers" 
            pattern="[a-zA-Z0-9]{6,}"
            title="Must be at least 6 alphanumeric characters">
        <br>
        <label for="verify">Verify Password:</label>
        <input type="password" name="verify" id="verify" required><br>
    </fieldset>

      <!-- Member Information -->
    <fieldset>
        <legend>Member Information</legend>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state"
               placeholder="2-character code"
               pattern="[A-Za-z]{2}"
               title="Use a 2-letter state code" required><br>

        <label for="zip">ZIP Code:</label>
        <input type="text" id="zip" name="zip"
               placeholder="5 or 9 digits"
               pattern="\d{5}(\d{4})?"
               title="Enter 5 or 9 digits" required><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="999-999-9999"
               pattern="\d{3}-\d{3}-\d{4}"
               title="Use the format 999-999-9999"><br>
    </fieldset>

    <!-- Membership Information -->
    <fieldset>
        <legend>Membership Information</legend>

        <label for="membershipType">Membership Type:</label>
        <select id="membershipType" name="membershipType">
            <option value="junior" selected>Junior</option>
            <option value="regular">Regular</option>
            <option value="senior">Senior</option>
        </select><br>

        <label for="startDate">Starting Date:</label>
        <input type="date" id="startDate" name="startDate" required><br>

        <label for="tickets">Tickets for Guests:</label>
        <input type="number" id="tickets" name="tickets" value="2" min="0"><br>
    </fieldset>

    <!-- How Did You Hear About Us? -->
    <fieldset>
        <legend>How Did You Hear About Us?</legend>

        <label>
            Search engine
            <input type="checkbox" name="hearAbout[]" value="search">
        </label><br>

        <label>
            Social media
            <input type="checkbox" name="hearAbout[]" value="social">
        </label><br>

        <label>
            Email
            <input type="checkbox" name="hearAbout[]" value="email">
        </label><br>

        <label>
            Friend or colleague
            <input type="checkbox" name="hearAbout[]" value="friend">
        </label>
    </fieldset>

     <!-- Comments -->
    <fieldset>
        <legend>Comments</legend>

        <label for="comments" class="visually-hidden">
            Comments
        </label>
        <textarea id="comments" name="comments" rows="5" cols="60"
            placeholder="If you have any comments, please enter them here.">
        </textarea>
    </fieldset>
    
    <!-- Submit Your Membership -->
    <fieldset>
        <legend>Submit Your Membership</legend>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset Fields">
    </fieldset>


</form>






</body>
